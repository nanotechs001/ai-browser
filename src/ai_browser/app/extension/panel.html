<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Browser</title>
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="brainui.css">
</head>
<body>
<header class="bar">
  <div class="brand"><span id="status" class="dot" data-state="connecting" title="Connecting…"></span>
    <span id="agent-dot" class="dot agent-dot" hidden></span><strong id="agent-name">AI Browser</strong></div>
  <div class="tools">
    <select id="model" title="Claude model">
      <option value="sonnet">Sonnet</option>
      <option value="opus">Opus</option>
      <option value="haiku">Haiku · fastest</option>
    </select>
    <button id="home" class="ghost" title="Every agent, tab and skill">AI Home</button>
  </div>
</header>
<main id="messages" aria-live="polite"></main>
<section id="start-here" class="empty" hidden>
  <p class="lead">Start a task in this tab</p>
  <p class="muted">An agent works right here, in front of you. It's your tab: the agent never closes it.</p>
  <div class="examples">
    <button class="example">Summarize this page</button>
    <button class="example">QA this site and list the problems</button>
    <button class="example">Find the contact form and check that it works</button>
  </div>
</section>
<section id="page-panel" class="page-panel" hidden>
  <div class="page-head"><span>The page Claude read last</span><button id="page-close" class="ghost">Close</button></div>
  <pre id="page"></pre>
</section>
<section id="permission-slot" aria-live="assertive"></section>
<footer class="composer">
  <textarea id="input" rows="1" placeholder="Start a task in this tab"></textarea>
  <div class="row">
    <button id="page-toggle" class="ghost" title="The numbered elements of the page Claude read last">Page</button>
    <span id="hint" class="hint"></span>
    <button id="stop" class="ghost" hidden>Stop</button>
    <button id="send" class="primary">Send</button>
  </div>
</footer>
<script type="module" src="panel.js"></script>
</body>
</html>
