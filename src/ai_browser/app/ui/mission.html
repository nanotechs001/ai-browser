<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="brainui.css">
<link rel="stylesheet" href="mission.css">
</head>
<body>
<div id="scene" class="scene" aria-label="The room: each agent at its station, the Brain in the middle"></div>
<header class="hud top">
  <div class="brand"><span id="status" class="dot" data-state="connecting" title="Connecting…"></span>
    <h1>Mission Control</h1><span id="counts" class="muted"></span></div>
  <div class="tools">
    <label class="switch" title="Updates spoken aloud, with a voice that runs on this computer only">
      <input id="voice" type="checkbox"> Voice</label>
    <span id="voice-note" class="muted" role="status"></span>
    <button id="list-button" class="ghost" aria-expanded="false" aria-controls="list">List</button>
    <button id="home-link" class="ghost" type="button" title="Back to AI Home's tab">AI Home</button>
  </div>
</header>
<nav id="list" class="hud panel list-panel" hidden aria-label="Agents"></nav>
<aside id="drawer" class="hud panel drawer" hidden aria-label="Details">
  <header><span id="drawer-dot" class="dot"></span><strong id="drawer-title"></strong>
    <button id="drawer-close" class="ghost" aria-label="Close">✕</button></header>
  <div id="drawer-body"></div>
</aside>
<section id="talk" class="hud panel talk" hidden data-state="idle" aria-label="Talk to the Brain">
  <ol id="talk-log" class="talk-log" aria-live="polite"></ol>
  <div id="talk-status" class="talk-status muted"></div>
  <div id="talk-notice" class="talk-notice" role="status"></div>
  <div id="talk-card" class="talk-card"></div>
  <form id="talk-form" class="talk-form">
    <input id="talk-text" type="text" maxlength="2000" autocomplete="off" placeholder="Ask the Brain"
           aria-label="Ask the Brain">
    <button type="submit">Ask</button>
  </form>
  <p class="talk-note muted">Your voice stays on this computer. Your words go to Claude, like typed text.</p>
</section>
<section id="task-bar" class="hud panel task-bar" aria-label="Give an agent a task">
  <textarea id="task" rows="1" placeholder="Give an agent a task, for example: QA my-site.com, 20 pages"></textarea>
  <select id="task-model" aria-label="Model">
    <option value="sonnet">Sonnet · balanced</option>
    <option value="opus">Opus · best</option>
    <option value="haiku">Haiku · fastest</option>
  </select>
  <select id="task-account" aria-label="Account" hidden></select>
  <button id="mic" class="mic" type="button" aria-pressed="false" aria-label="Talk to the Brain"
          title="Talk to the Brain: hold Space, or hold or click here"><svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/>
  </svg></button>
  <button id="start" class="primary">Start</button>
  <span id="task-note" class="muted note" role="status"></span>
</section>
<p id="help" class="hud help">Drag to turn · scroll to zoom · double-click to reset · <kbd>←</kbd> <kbd>→</kbd>
  <kbd>↑</kbd> <kbd>↓</kbd> <kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd> · hold <kbd>Space</kbd> to talk</p>
<script type="module" src="mission.js"></script>
</body>
</html>
