<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form test</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  label { display: block; margin: 6px 0; }
  .sr { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .fake { display: inline-block; width: 14px; height: 14px; border: 1px solid #333; }
</style>
</head>
<body>
<h1>Order form</h1>
<form id="order" onsubmit="event.preventDefault(); document.getElementById('status').textContent = 'Order sent'">
  <label>Full name <input id="name" value="Ada"></label>
  <label>Email <input id="email" type="email" placeholder="you@example.com"></label>
  <label>Password <input id="pw" type="password"></label>
  <label>Size <select id="size"><option>Small</option><option selected>Medium</option><option value="lg">Large</option></select></label>
  <label><input id="news" type="checkbox"> Subscribe to newsletter</label>
  <label><input id="agree" type="checkbox" class="sr"><span class="fake"></span> I agree</label>
  <label>Notes <textarea id="notes"></textarea></label>
  <button type="button" id="save" onclick="document.getElementById('status').textContent = 'Draft saved'">Save draft</button>
  <button type="submit" id="submit">Submit order</button>
</form>
<form id="search" action="privacy.html" method="get" role="search">
  <input name="q" aria-label="Search"> <button>Go</button>
</form>
<p><a href="/privacy.html">Privacy</a></p>
<p id="status">Ready</p>
<p>Counter: <span id="count">0</span>
  <button type="button" id="inc" onclick="count.textContent = +count.textContent + 1">Increment</button></p>
</body>
</html>
