[project]
name = "ai-browser"
version = "0.1.0"
description = "Sandboxed browser, shell and skill tools for Claude, served over MCP."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "mcp>=2,<3",
  "websockets>=15",
  "pyyaml>=6",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.2,<2"]  # talking to the Brain: speech to text on this computer (uv sync --extra voice)

[project.scripts]
ai-browser = "ai_browser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_browser"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "docker: needs Docker and the sandbox image",
  "posix_only: needs macOS or Linux (file descriptors 3 and 4, or the DevTools pipe)",
  "windows_only: Windows behaviour (junctions, msvcrt, Win32 APIs)",
]
